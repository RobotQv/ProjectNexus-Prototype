chat-input{display:flex;gap:10px;margin-top:20px}input,select,textarea{border:1px solid #cbdbe4;border-radius:6px;padding:10px;background:white;color:#22384b}input:focus,textarea:focus{outline:2px solid #a4d7db}textarea{resize:vertical;width:100%}label{display:block;font-size:14px;color:var(--muted);margin:9px 0 6px}.source{border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0;background:#fbfdfe;line-height:1.6}.source b{display:block;font-size:15px;margin-bottom:5px}.chip{font-size:12px;padding:5px 9px;background:#eef4f7;border-radius:20px;margin-right:4px;display:inline-block}.hidden{display:none!important}.checkline{display:flex;gap:12px;align-items:flex-start}.checkline input{margin-top:5px}.draft{border:1px solid var(--line);border-radius:9px;padding:19px;margin-bottom:14px}.draft-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.draft input{width:100%;font-size:14px}.draft input[type="checkbox"]{width:18px;height:18px;flex:0 0 18px;padding:0}.checkline>div{flex:1;min-width:0}.draft-grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr)}.graph{display:flex;align-items:center;justify-content:center;gap:19px;margin:25px 0}.node{border:2px solid #c4dce3;border-radius:10px;width:220px;padding:20px;background:#f8fcfd;min-height:113px}.node strong{font-size:17px;display:block;margin-bottom:12px}.node.current{border-color:#d5a256;background:#fff9f0}.arrow{color:#879ba9;font-size:25px;text-align:center}.arrow small{display:block;font-size:12px;margin-bottom:7px}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.settings input{width:100%}.result{padding:18px 20px;border-radius:8px;background:#fff5e6;border:1px solid #ecd6af;line-height:1.75}.footer-note{font-size:12px;color:var(--muted);margin-top:13px}.pill-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.modal-back{position:fixed;inset:0;background:#0b213766;display:flex;align-items:center;justify-content:center;z-index:10}.modal{background:white <aside id="sidebar" aria-label="主导航"><div class="brand">企业项目<br>智能协作平台<small>PROJECT · KNOWLEDGE · AI</small></div><button class="nav active" data-page="overview">◈　项目总览</button><button class="nav" data-page="tasks">▤　任务管理</button><button class="nav" data-page="documents">▣　项目资料库</button><button class="nav" data-page="assistant">◇　AI 项目助手</button><button class="nav" data-page="workflow">☑　提取结果确认</button><button class="nav" data-page="dependencies">⌘　依赖与风险</button><div class="aside-foot">六人协作 · PC / Mobile Web 原型<br>本地演示 / 不连接后端<br>刷新页面恢复示例数据</div></aside>

<header><button id="menuToggle" class="menu-toggle" type="button" aria-label="打开导航" aria-controls="sidebar" aria-expanded="false" onclick="toggleNav()">☰</button><div class="project">校园外卖平台 <span class="muted small"> / 示例项目</span></div><div class="row header-actions"><span class="badge warn">可交互原型 · 非实际运行结果</span><button onclick="showHelp()">原型说明</button></div></header>
<main id="main"></main><div id="modal" class="modal-back hidden" role="dialog" aria-modal="true"></div><div id="toast" class="hidden"></div><input id="upload" type="file" accept=".pdf,.docx,.txt,.md" class="hidden" multiple>
<script>
const S={page:'overview',a:70,b:80,gate:90,forecast:'2026-09-20',needed:'2026-09-19',approved:false,taskFilter:'all',tasks:[{id:17,title:'支付模块开发',owner:'示例成员甲',progress:70,status:'进行中'},{id:18,title:'前端订单页面',owner:'示例成员乙',progress:80,status:'进行中'},{id:19,title:'接口联调与验收',owner:'示例成员丙',progress:0,status:'未开始'},{id:20,title:'用户登录功能',owner:'示例成员丁',progress:100,status:'已完成'}],docs:[{name:'支付模块需求说明.pdf',type:'需求文档',state:'ready',chunks:18},{name:'09-18 项目会议纪要.docx',type:'会议纪要',state:'ready',chunks:9},{name:'项目接口规范.md',type:'技术资料',state:'failed',chunks:0}],chat:null};
const $=s=>document.querySelector(s);const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pageHeading=(title,sub,actions='')=>`<div class="top"><div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="actions">${actions}</div></div>`;
const progress=v=>`<span class="bar"><span style="width:${v}%"></span></span>${v}%`;
function syncTasks(){S.tasks[0].progress=S.a;S.tasks[1].progress=S.b}
function rows(arr,edit=false){return arr.map(t=>`<tr><td><b>${esc(t.title)}</b><br><span class="small muted">TASK-${t.id}</span></td><td>${esc(t.owner)}</td><td>${progress(t.progress)}</td><td><span class="badge ${t.progress===0?'gray':''}">${t.progress===100?'已完成':t.progress===0?'未开始':'进行中'}</span></td>${edit?`<td><button onclick="editTask(${t.id})">编辑</button></td>`:''}</tr>`).join('')}
function overview(){return pageHeading('项目总览','把资料、任务和 AI 分析放在同一个工作空间。',`<button class="primary" onclick="nav('documents')">上传项目资料</button>`)+`<div class="metrics"><div class="metric"><span class="label">项目任务</span><div class="value">${S.tasks.length}</div><small>结构化任务记录</small></div><div class="metric"><span class="label">已完成任务</span><div class="value">${S.tasks.filter(t=>t.progress===100).length}</div><small>不是工时加权进度</small></div><div class="metric"><span class="label">已索引资料</span><div class="value">${S.docs.filter(d=>d.state==='ready').length}</div><small>另有失败状态可重试</small></div><div class="metric"><span class="label">待确认建议</span><div class="value">${S.approved?0:2}</div><small>确认前不改任务库</small></div></div><div class="grid"><section class="card"><div class="row spaced"><h2>近期任务</h2><button onclick="nav('tasks')">管理任务</button></div><table><tr><th>任务</th><th>负责人</th><th>当前进度</th><th>状态</th></tr>${rows(S.tasks.slice(0,4))}</table></section><section class="card"><h2>需要关注</h2><div class="list-item"><span class="badge warn">未来关卡风险</span><br>前端订单页面到 ${S.gate}% 时，需要支付模块完成。<br><a href="#dependencies" onclick="nav('dependencies');return false">查看依据与依赖链 →</a></div><div class="list-item"><span class="badge gray">待人工确认</span><br>会议纪要中发现任务与依赖建议。<br><a href="#workflow" onclick="nav('workflow');return false">审阅提取结果 →</a></div><div class="list-item"><b>先试一句</b><br>“支付那块进度怎样，为什么卡住？”<br><a href="#assistant" onclick="nav('assistant');return false">打开 AI 助手 →</a></div></section></div><div class="footer-note">页面指标仅根据原型中的示例记录计算，不代表已实现的后端性能或真实项目状态。</div>`}
function tasks(){const arr=S.tasks.filter(t=>S.taskFilter==='all'||(S.taskFilter==='doing'&&t.progress>0&&t.progress<100)||(S.taskFilter==='done'&&t.progress===100));return pageHeading('任务管理','任务状态以业务数据库为准；语义索引只帮助定位任务。',`<button class="primary" onclick="editTask()">+ 新建任务</button>`)+`<section class="card"><div class="row spaced" style="margin-bottom:16px"><h2>项目任务列表</h2><select onchange="S.taskFilter=this.value;render()"><option value="all" ${S.taskFilter==='all'?'selected':''}>全部状态</option><option value="doing" ${S.taskFilter==='doing'?'selected':''}>进行中</option><option value="done" ${S.taskFilter==='done'?'selected':''}>已完成</option></select></div><table><tr><th>任务 / 编号</th><th>负责人</th><th>进度</th><th>状态</th><th>操作</th></tr>${rows(arr,true)}</table></section><div class="note">依赖不是“前置任务没做完，后置任务就不能做”。任务详情需要记录依赖关卡、计划时间与最新人工预估。</div><button onclick="nav('dependencies')">查看任务依赖模型 →</button>`}
function documents(){return pageHeading('项目资料库','上传后自动处理；索引完成后，资料才进入问答检索范围。',`<button onclick="sampleUpload()">演示上传</button><button class="primary" onclick="$('#upload').click()">选择文件</button>`)+`<div class="dropzone"><div><b>PDF / DOCX / TXT / Markdown</b><p class="sub">本原型只模拟上传状态，不读取或发送文件内容。</p><div class="flow"><b>保存资料</b> → 解析 → 切块 → Embedding → <b>可检索</b></div></div><span class="badge">解析结果可复用给工作流</span></div><section class="card"><table><tr><th>资料名称</th><th>类型</th><th>索引状态</th><th>片段数</th><th>操作</th></tr>${S.docs.map((d,i)=>`<tr><td><b>${esc(d.name)}</b><br><span class="small muted">示例资料 · 文档版本 1</span></td><td>${d.type}</td><td><span class="badge ${d.state==='failed'?'red':d.state==='processing'?'warn':''}">${d.state==='ready'?'已索引':d.state==='failed'?'处理失败':'处理中'}</span></td><td>${d.state==='ready'?d.chunks:'—'}</td><td><div class="actions">${d.state==='failed'?`<button onclick="retryDoc(${i})">重试</button>`:`<button onclick="sourceModal()">原文</button><button onclick="nav('workflow')">提取任务</button>`}<button onclick="deleteDoc(${i})">删除</button></div></td></tr>`).join('')}</table></section><div class="note">原文、任务建议和已确认任务是三种不同记录。删除文档不能悄悄删除已经确认的业务任务；正式系统需保留来源缺失提示。</div>`}
function defaultAnswer(){return `<p><b>支付模块当前进度为 ${S.a}%，负责人是示例成员甲。</b>这部分来自任务记录，而不是历史会议纪要。</p><p>示例会议纪要提到：第三方支付测试账号尚未开通，可能影响联调。这是一条文档依据，不能直接当作当前阻塞的确定结论。</p><p>依赖规则显示：前端任务当前为 ${S.b}%，到 ${S.gate}% 时才需要支付模块达到 100%。${S.b>=S.gate?'目前已到关卡，前置条件仍未满足。':'目前尚未到该关卡，存在后续风险但不能判定已经停工。'}</p><button onclick="sourceModal()">[1] 查看会议纪要原文</button>`}
function assistant(){return pageHeading('AI 项目助手','先定位实体、再读取当前事实；需要解释时补充文档依据。')+`<div class="chat-wrap"><section class="card"><div class="bubble user">${esc(S.chat?.q||'支付那块进度怎样，为什么卡住？')}</div><div class="bubble">${S.chat?.a||defaultAnswer()}</div><div class="pill-list"><span class="chip">轻 RAG → TASK-17</span><span class="chip">业务库 → 当前进度</span><span class="chip">主 RAG → 会议纪要</span></div><form class="chat-input" onsubmit="ask(event)"><input id="question" aria-label="问题" style="flex:1" placeholder="试试：登录做到哪了？"><button class="primary">发送</button></form><p class="footer-note">此处为脚本化交互示例，不调用真实大模型。</p></section><section class="card"><h2>事实与来源</h2><div class="source"><b>当前任务记录</b>TASK-17 · 支付模块开发<br>进度：${S.a}%<br><span class="small muted">正式系统将显示更新时间与任务链接</span></div><div class="source"><b>[1] 09-18 项目会议纪要</b>第 3 段 · 文档版本 1<br>“测试账号尚未开通……”<br><button style="margin-top:10px" onclick="sourceModal()">展开证据</button></div><div class="source"><b>判断边界</b>当前进度、历史解释与规则风险分别标注；没有依据时明确说明。</div></section></div>`}
function workflow(){return pageHeading('提取结果确认','模型只生成建议，由用户确认后再进入正式任务与依赖关系。',`<button onclick="sourceModal()">查看来源原文</button>`)+`<div class="note">来源：09-18 项目会议纪要.docx · 版本 1 · 第 3—4 段。以下均为示例提取结果；负责人和日期可以修改。</div><section class="card"><div class="row spaced"><h2>待确认建议</h2><span class="badge ${S.approved?'':'warn'}">${S.approved?'已提交，不会重复创建':'2 项待确认'}</span></div><div class="draft"><div class="checkline"><input type="checkbox" id="chooseTask" checked ${S.approved?'disabled':''}><div style="flex:1"><h3>建议 1 · 新建任务</h3><div class="draft-grid"><div><label>任务标题</label><input id="draftTitle" value="开通支付测试账号" ${S.approved?'disabled':''}></div><div><label>负责人</label><input id="draftOwner" value="示例成员甲" ${S.approved?'disabled':''}></div><div><label>计划完成</label><input id="draftDue" type="date" value="2026-09-19" ${S.approved?'disabled':''}></div></div></div></div></div><div class="draft"><div class="checkline"><input type="checkbox" id="chooseDep" checked ${S.approved?'disabled':''}><div><h3>建议 2 · 关联一条依赖</h3>支付模块开发 → 前端订单页面的联调阶段<p class="sub" style="margin-top:8px">关卡参数需要人工确认，不能仅凭“依赖”两个字自动推断。</p></div></div></div><div class="actions"><button class="primary" ${S.approved?'disabled':''} onclick="approveDrafts()">确认所选建议</button><button ${S.approved?'disabled':''} onclick="rejectDrafts()">拒绝并保留记录</button><button onclick="nav('tasks')">查看正式任务</button></div></section><div class="footer-note">正式系统将记录建议 ID、审核人、确认时间和目标任务 ID，防止重复点击创建重复任务。</div>`}
function riskText(){if(S.a>=100)return ['前置条件已满足','支付模块已满足 100% 的要求；该依赖不再阻止越过当前关卡。'];if(S.b>=100)return ['数据存在冲突','后置任务已完成，但前置条件仍未满足。需要复核状态或依赖定义，而不是自动修改完成状态。'];if(S.b>=S.gate)return ['当前关卡受阻',`后置任务已到 ${S.gate}% 的关卡，但前置任务只有 ${S.a}%，不能越过该关卡。`];if(!S.forecast||!S.needed)return ['尚未到关卡 · 时间信息不足','目前不能判定当前受阻；缺少最新预计完成时间或关卡需要日期，不能判定时间风险高低。'];if(S.forecast>S.needed)return ['未来关卡存在风险',`当前尚未到关卡；人工预估 A 于 ${S.forecast} 完成，晚于 B 的需要日期 ${S.needed}。这是预警，不是确定延期。`];return ['当前未发现时间冲突','前置条件尚未满足，但人工预估时间没有晚于关卡需要日期；结论依赖预估数据及时更新。']}
function dependencies(){const r=riskText();return pageHeading('任务依赖与风险','判断依据来自关卡和日期，而不是比较两个任务的百分比。',`<button onclick="render()">重新计算</button>`)+`<section class="card"><div class="row spaced"><h2>支付模块 → 前端联调 → 项目验收</h2><span class="badge warn">演示规则 · 人工录入数据</span></div><div class="graph"><div class="node"><strong>A · 支付模块开发</strong>${progress(S.a)}<p class="sub">前置要求：完成 100%</p></div><div class="arrow"><small>B 到 ${S.gate}% 时需要</small>→</div><div class="node current"><strong>B · 前端订单页面</strong>${progress(S.b)}<p class="sub">后置关卡：${S.gate}%</p></div><div class="arrow"><small>下游影响范围</small>→</div><div class="node"><strong>C · 接口联调与验收</strong>${progress(0)}<p class="sub">潜在受影响，不等于已受阻</p></div></div><div class="settings"><div><label>A 当前进度（%）</label><input id="aProgress" type="number" min="0" max="100" value="${S.a}" onchange="setRisk('a',this.value)"></div><div><label>B 当前进度（%）</label><input id="bProgress" type="number" min="0" max="100" value="${S.b}" onchange="setRisk('b',this.value)"></div><div><label>B 的依赖关卡（%）</label><input id="gateProgress" type="number" min="1" max="99" value="${S.gate}" onchange="setRisk('gate',this.value)"></div><div><label>B 需要前置成果的日期</label><input id="neededDate" type="date" value="${S.needed}" onchange="S.needed=this.value;render()"></div></div><div class="row" style="margin:16px 0"><label style="margin:0">A 最新人工预计完成：</label><input id="forecastDate" type="date" value="${S.forecast}" onchange="S.forecast=this.value;render()"><button onclick="S.forecast='';render()">演示缺失日期</button></div><div class="result"><b>${r[0]}</b><br>${r[1]}</div></section><p class="footer-note">试验：A=70、B=80，分别把关卡设为 90 和 80。下游节点仅展示潜在影响路径，不能自动断言全部任务已延期。</p>`}
function setRisk(k,v){let n=Number(v);if(!Number.isFinite(n))return;S[k]=Math.max(k==='gate'?1:0,Math.min(k==='gate'?99:100,n));syncTasks();render()}
function render(){syncTasks();$('#main').innerHTML=({overview,tasks,documents,assistant,workflow,dependencies}[S.page])();document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.page===S.page));document.querySelectorAll('#main table').forEach(table=>{if(table.parentElement.classList.contains('table-scroll'))return;const wrap=document.createElement('div');wrap.className='table-scroll';table.parentNode.insertBefore(wrap,table);wrap.appendChild(table)});}
function setNavOpen(open){document.body.classList.toggle('nav-open',open);const button=$('#menuToggle');if(button){button.setAttribute('aria-expanded',String(open));button.setAttribute('aria-label',open?'关闭导航':'打开导航')}}
function toggleNav(){setNavOpen(!document.body.classList.contains('nav-open'))}
function closeNav(){setNavOpen(false)}
function nav(p){S.page=p;location.hash=p;closeNav();render();window.scrollTo(0,0)}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),2500)}
function modal(content){$('#modal').innerHTML=`<div class="modal">${content}</div>`;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
$('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeNav()}});window.addEventListener('resize',()=>{if(window.innerWidth>720)closeNav()});
function showHelp(){modal(`<h2>原型说明</h2><p>这是单文件、可离线打开的交互原型，不是正式 Vue 前端，也不连接 FastAPI、数据库或大模型。</p><p>可操作：切换页面；新增/编辑任务；模拟上传、失败重试与删除；查看引用；确认建议；修改进度与关卡观察规则结果。</p><p>所有人名、日期、进度、文档和回答均为演示数据。页面刷新后恢复初始状态。正式系统需由团队按接口契约实现。</p><div class="actions"><button class="primary" onclick="closeModal()">知道了</button></div>`)}
function sourceModal(){modal(`<h2>原文依据 · 示例</h2><p class="muted">09-18 项目会议纪要.docx / 版本 1 / 第 3—4 段</p><div class="bubble">第三方支付测试账号尚未开通，可能影响后续联调。由示例成员甲负责推动账号开通，计划于 9 月 19 日完成。前端订单页面可以先做界面，但联调阶段需要支付模块提供完整能力。</div><p class="small muted">这段原文用于原型演示。正式系统应定位到实际上传资料的文档版本和段落锚点。</p><div class="actions"><button class="primary" onclick="closeModal()">关闭</button></div>`)}
function editTask(id){const t=S.tasks.find(x=>x.id===id)||{title:'',owner:'',progress:0};modal(`<h2>${id?'编辑':'新建'}任务</h2><form onsubmit="saveTask(event,${id||0})"><label>任务标题</label><input id="tTitle" required style="width:100%" value="${esc(t.title)}"><label>负责人</label><input id="tOwner" required style="width:100%" value="${esc(t.owner)}"><label>当前进度（0—100）</label><input id="tProgress" type="number" min="0" max="100" value="${t.progress}" required><p class="small muted">这里只演示少量字段；正式数据结构以架构预案为准。</p><div class="actions"><button type="button" onclick="closeModal()">取消</button><button class="primary">保存</button></div></form>`)}
function saveTask(e,id){e.preventDefault();const v={title:$('#tTitle').value.trim(),owner:$('#tOwner').value.trim(),progress:Number($('#tProgress').value)};if(!v.title||!v.owner)return;const t=S.tasks.find(x=>x.id===id);if(t)Object.assign(t,v);else S.tasks.push({id:Math.max(...S.tasks.map(t=>t.id))+1,...v});if(id===17)S.a=v.progress;if(id===18)S.b=v.progress;closeModal();render();toast('已保存到原型内存；未调用后端')}
function sampleUpload(){simulateUpload('新增项目资料.txt')}
function simulateUpload(name){const d={name,type:'新上传资料',state:'processing',chunks:0};S.docs.push(d);render();setTimeout(()=>{d.state='ready';d.chunks=6;if(S.page==='documents'||S.page==='overview')render();toast('模拟索引完成（没有实际执行 Embedding）')},1100)}
$('#upload').onchange=e=>{[...e.target.files].forEach(f=>simulateUpload(f.name));e.target.value=''};
function retryDoc(i){S.docs[i].state='processing';render();setTimeout(()=>{if(S.docs[i]){S.docs[i].state='ready';S.docs[i].chunks=12;render();toast('示例重试完成')}},1000)}
function deleteDoc(i){S.docs.splice(i,1);render();toast('已从原型资料列表删除')}
function approveDrafts(){if(S.approved)return;if(!$('#chooseTask').checked&&!$('#chooseDep').checked){toast('请至少选择一项建议');return}if($('#chooseTask').checked){const title=$('#draftTitle').value.trim();if(!title){toast('任务标题不能为空');return}S.tasks.push({id:Math.max(...S.tasks.map(t=>t.id))+1,title,owner:$('#draftOwner').value.trim()||'未分配',progress:0})}S.approved=true;render();toast('示例建议已确认；重复点击不会重复建任务')}
function rejectDrafts(){S.approved=true;render();toast('示例建议已处理；未创建任务')}
function ask(e){e.preventDefault();const q=$('#question').value.trim();if(!q)return;let a;if(q.includes('登录'))a=`<p>“登录”可能指用户登录功能，也可能指登录页面。请先确认查询对象。</p><button onclick="S.chat={q:'用户登录功能做到哪了？',a:'用户登录功能当前进度为 100%，来自 TASK-20 的示例记录。'};render()">用户登录功能</button>`;else if(/支付|前端|进度/.test(q))a=defaultAnswer();else a='<p>这个原型没有连接真实检索或模型。正式系统遇到资料不足时，应提示“缺少支持该问题的资料”，而不是编造答案。</p>';S.chat={q,a};render()}
if(location.hash&&['overview','tasks','documents','assistant','workflow','dependencies'].includes(location.hash.slice(1)))S.page=location.hash.slice(1);render();
</script></body></html>
